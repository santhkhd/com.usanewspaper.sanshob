name: Update US News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (PRIORITY, ROTATION, FULL)"
        required: false
        default: "ROTATION"
        type: choice
        options:
          - PRIORITY
          - ROTATION
          - FULL

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Collect News & Summarize
        run: |
          MODE="${{ inputs.mode || 'ROTATION' }}"
          python backend/generate_news.py --mode="$MODE"

      - name: Commit and Push Updated News JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us_news.json data/categories.json
          if git diff --staged --quiet; then
            echo "No changes to commit in data/"
          else
            git commit -m "Update US news collection and summaries [skip ci]"
            git push
          fi
