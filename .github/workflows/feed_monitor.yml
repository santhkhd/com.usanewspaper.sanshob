name: Multi-App Feed Monitor & Push Notifications

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour automatically
  workflow_dispatch:     # Allows manual trigger anytime from GitHub Actions tab

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r automation/requirements.txt

      - name: Run Multi-App Feed Monitor
        env:
          # Tamil App
          TAMIL_ONESIGNAL_APP_ID: ${{ secrets.TAMIL_ONESIGNAL_APP_ID }}
          TAMIL_ONESIGNAL_REST_KEY: ${{ secrets.TAMIL_ONESIGNAL_REST_KEY }}
          # Malayalam App
          MALAYALAM_ONESIGNAL_APP_ID: ${{ secrets.MALAYALAM_ONESIGNAL_APP_ID }}
          MALAYALAM_ONESIGNAL_REST_KEY: ${{ secrets.MALAYALAM_ONESIGNAL_REST_KEY }}
          # Hindi App
          HINDI_ONESIGNAL_APP_ID: ${{ secrets.HINDI_ONESIGNAL_APP_ID }}
          HINDI_ONESIGNAL_REST_KEY: ${{ secrets.HINDI_ONESIGNAL_REST_KEY }}
          # Malayalam Troll App
          MALAYALAMTROLL_ONESIGNAL_APP_ID: ${{ secrets.MALAYALAMTROLL_ONESIGNAL_APP_ID }}
          MALAYALAMTROLL_ONESIGNAL_REST_KEY: ${{ secrets.MALAYALAMTROLL_ONESIGNAL_REST_KEY }}
          # Global Fallback
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: |
          python automation/feed_monitor.py

      - name: Commit and Push State (Update last_seen tracking files)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add automation/state/ automation/last_seen.json
          git commit -m "Update feed monitor state [skip ci]" || echo "No state changes to commit"
          git pull --rebase
          git push
